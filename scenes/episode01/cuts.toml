# 第1話「消えたポテチ」カット表
#
# - カットは上から順に並べる。開始位置は書かない（長さの合計で自動的に決まる）。
# - 長さは seconds（秒）か frames（コマ, 24fps）のどちらか。
# - セリフ [[cut.line]] / 効果音 [[cut.sfx]] の位置は、カットの頭からの at（秒）か at_frame（コマ）。
# - camera: center = 画面中心のワールド座標 [x, y]、scale = 画面の横幅（ワールド単位）。
#   preset を書くと [cameras] の値を使う。
# - status: todo（未着手）/ temp（仮素材で実装済み）/ final（正式素材で完成）
# - shot: このカットを実装しているスクリプト（scenes/episode01/shots/<shot>.py）
# - 犬太朗のセリフは視聴者には日本語、人間（海斗）には鳴き声 → heard_by_humans = "bark"
#
# 秒数は脚本の暫定値。演技に合わせて変えてよい（合計は約60秒が目標）。

[episode]
id = "episode01"
title = "消えたポテチ"
fps = 24
width = 1920
height = 1080

# 仮音声（macOS の say）の声。正式音声が入ったら line の audio に置き換える
[temp_voices]
kaito = { voice = "Reed", rate = 190 }
inutarou = { voice = "Rocko", rate = 210 }
narration = { voice = "Kyoko", rate = 420 }

[cameras]
wide = { center = [0.0, 0.0], scale = 16.0 }
two_shot = { center = [-0.3, -0.25], scale = 12.5 }
inu_close = { center = [1.9, 1.05], scale = 4.6 }
inu_hand = { center = [1.5, 0.8], scale = 4.0 }
kaito_close = { center = [-2.7, 1.7], scale = 5.4 }

